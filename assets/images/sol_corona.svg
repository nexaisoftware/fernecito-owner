<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sol decorativo Corona">
  <defs>
    <style>
      .negro { fill: #121212; }
      .blanco { fill: #fafafa; }
      .gris { fill: #9e9e9e; }
      .linea {
        fill: none;
        stroke: #ececec;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .borde-negro {
        fill: none;
        stroke: #121212;
        stroke-width: 18;
      }
      .borde-gris {
        fill: none;
        stroke: #757575;
        stroke-width: 3.5;
      }
    </style>

    <!-- Rayo curvo derecha -->
    <path id="rayo-der" d="
      M 234 182
      C 220 148 208 108 198 62
      C 214 108 226 148 238 178
      C 240 183 238 186 234 185
      C 232 184 234 182 234 182 Z
    "/>
    <!-- Rayo curvo izquierda -->
    <path id="rayo-izq" d="
      M 278 182
      C 292 148 304 108 314 62
      C 298 108 286 148 274 178
      C 272 183 274 186 278 185
      C 280 184 278 182 278 182 Z
    "/>
    <!-- Hoja interior del rayo -->
    <path id="hoja" d="
      M 256 176
      C 248 132 242 94 236 68
      C 244 100 250 138 254 168
      Z
    "/>
    <!-- Hoja espejo -->
    <path id="hoja-espejo" d="
      M 256 176
      C 264 132 270 94 276 68
      C 268 100 262 138 258 168
      Z
    "/>
  </defs>

  <!-- ??? Borde doble ??? -->
  <circle class="borde-negro" cx="256" cy="256" r="234"/>
  <circle class="borde-gris" cx="256" cy="256" r="212"/>

  <!-- ??? Cuerpo del sol ??? -->
  <g class="negro">
    <circle cx="256" cy="256" r="90"/>
    <use href="#rayo-der" transform="rotate(0 256 256)"/>
    <use href="#rayo-izq" transform="rotate(45 256 256)"/>
    <use href="#rayo-der" transform="rotate(90 256 256)"/>
    <use href="#rayo-izq" transform="rotate(135 256 256)"/>
    <use href="#rayo-der" transform="rotate(180 256 256)"/>
    <use href="#rayo-izq" transform="rotate(225 256 256)"/>
    <use href="#rayo-der" transform="rotate(270 256 256)"/>
    <use href="#rayo-izq" transform="rotate(315 256 256)"/>
  </g>

  <!-- ??? Detalles internos (recortes blancos) ??? -->
  <g class="blanco">
    <!-- Anillo interior del disco -->
    <circle cx="256" cy="256" r="76" fill="none" stroke="#fafafa" stroke-width="2.8"/>

    <!-- Flor central de 4 p�talos org�nicos -->
    <path d="
      M 256 204
      C 272 212 286 228 294 248
      C 276 240 262 234 256 232
      C 250 234 236 240 218 248
      C 226 228 240 212 256 204 Z
    "/>
    <path d="
      M 308 256
      C 300 272 284 286 264 294
      C 272 276 278 262 280 256
      C 278 250 272 236 264 218
      C 284 226 300 240 308 256 Z
    "/>
    <path d="
      M 256 308
      C 240 300 226 284 218 264
      C 236 272 250 278 256 280
      C 262 278 276 272 294 264
      C 286 284 272 300 256 308 Z
    "/>
    <path d="
      M 204 256
      C 212 240 228 226 248 218
      C 240 236 234 250 232 256
      C 234 262 240 276 248 294
      C 228 286 212 272 204 256 Z
    "/>

    <!-- N�cleo -->
    <circle cx="256" cy="256" r="16"/>

    <!-- Volutas secundarias -->
    <path d="M 256 220 C 246 226 238 238 234 250 C 242 242 250 234 256 230 Z"/>
    <path d="M 292 256 C 286 246 274 238 262 234 C 270 242 278 250 282 256 Z"/>
    <path d="M 256 292 C 266 286 274 274 278 262 C 270 270 262 278 256 282 Z"/>
    <path d="M 220 256 C 226 266 238 274 250 278 C 242 270 234 262 230 256 Z"/>

    <!-- Hojas en cada rayo -->
    <use href="#hoja" transform="rotate(0 256 256)"/>
    <use href="#hoja-espejo" transform="rotate(45 256 256)"/>
    <use href="#hoja" transform="rotate(90 256 256)"/>
    <use href="#hoja-espejo" transform="rotate(135 256 256)"/>
    <use href="#hoja" transform="rotate(180 256 256)"/>
    <use href="#hoja-espejo" transform="rotate(225 256 256)"/>
    <use href="#hoja" transform="rotate(270 256 256)"/>
    <use href="#hoja-espejo" transform="rotate(315 256 256)"/>
  </g>

  <!-- ??? Trazos finos decorativos ??? -->
  <g class="linea">
    <!-- Espiral doble del centro -->
    <path d="M 256 236 C 274 236 288 250 288 268 C 288 286 274 300 256 300"/>
    <path d="M 256 300 C 238 300 224 286 224 268 C 224 250 238 236 256 236"/>

    <!-- Venas de los rayos -->
    <path d="M 256 172 C 248 124 240 80 232 48" transform="rotate(0 256 256)"/>
    <path d="M 256 172 C 248 124 240 80 232 48" transform="rotate(45 256 256)"/>
    <path d="M 256 172 C 248 124 240 80 232 48" transform="rotate(90 256 256)"/>
    <path d="M 256 172 C 248 124 240 80 232 48" transform="rotate(135 256 256)"/>
    <path d="M 256 172 C 248 124 240 80 232 48" transform="rotate(180 256 256)"/>
    <path d="M 256 172 C 248 124 240 80 232 48" transform="rotate(225 256 256)"/>
    <path d="M 256 172 C 248 124 240 80 232 48" transform="rotate(270 256 256)"/>
    <path d="M 256 172 C 248 124 240 80 232 48" transform="rotate(315 256 256)"/>

    <!-- Arcos decorativos entre rayos (cerca del disco) -->
    <path d="M 296 216 C 310 230 318 248 318 266" transform="rotate(0 256 256)"/>
    <path d="M 296 216 C 310 230 318 248 318 266" transform="rotate(90 256 256)"/>
    <path d="M 296 216 C 310 230 318 248 318 266" transform="rotate(180 256 256)"/>
    <path d="M 296 216 C 310 230 318 248 318 266" transform="rotate(270 256 256)"/>
  </g>

  <!-- ??? Acentos grises en uni�n rayo-disco ??? -->
  <g class="gris">
    <circle cx="256" cy="166" r="5.5" transform="rotate(0 256 256)"/>
    <circle cx="256" cy="166" r="5.5" transform="rotate(45 256 256)"/>
    <circle cx="256" cy="166" r="5.5" transform="rotate(90 256 256)"/>
    <circle cx="256" cy="166" r="5.5" transform="rotate(135 256 256)"/>
    <circle cx="256" cy="166" r="5.5" transform="rotate(180 256 256)"/>
    <circle cx="256" cy="166" r="5.5" transform="rotate(225 256 256)"/>
    <circle cx="256" cy="166" r="5.5" transform="rotate(270 256 256)"/>
    <circle cx="256" cy="166" r="5.5" transform="rotate(315 256 256)"/>
  </g>
</svg>
