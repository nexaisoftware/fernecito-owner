  <script>
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.deferredPrompt = e;
      window.dispatchEvent(new Event('pwa-install-available'));
    });
    window.addEventListener('appinstalled', function () {
      window.deferredPrompt = null;
      window.dispatchEvent(new Event('pwa-installed'));
    });
    window.solicitarInstalacionPwa = function () {
      return new Promise(function (resolve) {
        var prompt = window.deferredPrompt;
        if (!prompt) {
          resolve(false);
          return;
        }
        prompt.prompt();
        prompt.userChoice
          .then(function (choice) {
            window.deferredPrompt = null;
            resolve(choice.outcome === 'accepted');
          })
          .catch(function () {
            window.deferredPrompt = null;
            resolve(false);
          });
      });
    };

    window.fernecitoForzarRecargaPwa = async function () {
      try {
        if ('serviceWorker' in navigator) {
          var registration = await navigator.serviceWorker.getRegistration();
          if (registration) {
            try {
              await registration.update();
            } catch (e) {}
            if (registration.waiting) {
              registration.waiting.postMessage('skipWaiting');
              registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              await new Promise(function (resolve) {
                var done = false;
                var finish = function () {
                  if (done) return;
                  done = true;
                  resolve();
                };
                navigator.serviceWorker.addEventListener('controllerchange', finish, { once: true });
                setTimeout(finish, 700);
              });
            }
          }
        }
        if ('caches' in window) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (key) { return caches.delete(key); }));
        }
      } catch (e) {}
      window.location.reload();
    };
  </script>

  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #F8F7FC;
          background-size: 100% 100%;
    }

    #splash {
      display: none;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.documentElement.style.backgroundColor = "#F8F7FC";
      document.body.style.background = "#F8F7FC";
    }
  </script>
